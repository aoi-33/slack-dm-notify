<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Slack Notify{% endblock %}</title>
  <style>
    :root{
      --bg:#f4f5f7; --surface:#ffffff; --code-bg:#0f1117; --code-text:#e6e8ee;
      --border:#e3e6eb; --text:#191c22; --muted:#6b7280;
      --accent:#611f69; --accent-press:#4a154b; --accent-soft:#f3eaf4;
      --green:#197a55; --green-soft:#e7f4ee; --red:#b3261e;
      --radius:14px; --radius-sm:9px;
      --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.05);
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);
      line-height:1.55;-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .app{max-width:900px;margin:0 auto;padding:24px 20px 64px}
    .auth{min-height:100dvh;display:grid;place-items:center;padding:24px}

    /* brand / topbar */
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:18px}
    .brand .dot{width:14px;height:14px;border-radius:4px;background:var(--accent);
      box-shadow:0 0 0 4px var(--accent-soft)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
    .topbar .who{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}

    /* card */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:20px}
    .card + .card{margin-top:16px}

    /* headings */
    h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
    h2{font-size:15px;margin:0;color:var(--muted);font-weight:600}
    .sub{color:var(--muted);font-size:14px;margin:0 0 20px}

    /* buttons */
    .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
      background:var(--surface);color:var(--text);padding:8px 14px;border-radius:var(--radius-sm);
      font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .12s ease;white-space:nowrap}
    .btn:hover{border-color:#cfd4dc;text-decoration:none}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{background:var(--accent-press);border-color:var(--accent-press)}
    .btn.block{width:100%;justify-content:center;padding:11px}
    .btn.sm{padding:6px 10px;font-size:13px}
    .btn.ghost{background:transparent}
    .btn.accent{color:var(--accent)}
    .btn.accent:hover{background:var(--accent-soft);border-color:var(--accent-soft)}
    .btn.danger{color:var(--red)}
    .btn.danger:hover{background:#fdeceb;border-color:#fadbd8}
    .inline-form{display:inline}

    /* forms */
    label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--text)}
    .field{margin-bottom:16px}
    .hint{font-size:12px;color:var(--muted);margin-top:6px}
    input,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
      font:inherit;font-size:14px;background:#fff;color:var(--text);transition:border .12s,box-shadow .12s}
    textarea{resize:vertical;min-height:96px;font-family:var(--mono);font-size:13px;line-height:1.5}
    input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

    /* alerts */
    .alert{padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;margin-bottom:16px;
      background:#fdeceb;color:#7a1c16;border:1px solid #fadbd8}

    /* chips */
    .chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;
      background:#eef1f5;color:#3a414c;border:1px solid var(--border)}
    .chip.mono{font-family:var(--mono)}
    .chip.var{background:var(--accent-soft);color:var(--accent-press);border-color:#e7d6ea}

    /* type card */
    .type-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .type-name{font-size:16px;font-weight:700;margin:0}
    .type-id{margin-top:4px}
    .type-actions{display:flex;gap:6px;flex-wrap:wrap}
    .template-preview{margin:14px 0 10px;padding:12px 14px;background:#f7f8fa;border:1px solid var(--border);
      border-radius:var(--radius-sm);font-family:var(--mono);font-size:13px;white-space:pre-wrap;
      word-break:break-word;color:#2a2f37}
    .vars{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .vars .label-inline{color:var(--muted);font-size:12px;align-self:center;margin-right:2px}

    /* examples (code) */
    .examples{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
    .ex-head{display:flex;align-items:center;justify-content:space-between;background:#f7f8fa;
      border-bottom:1px solid var(--border);padding:6px 8px 0}
    .tabs{display:flex;gap:2px}
    .tab{appearance:none;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;
      color:var(--muted);padding:7px 12px;cursor:pointer;border-radius:8px 8px 0 0;border-bottom:2px solid transparent}
    .tab:hover{color:var(--text)}
    .tab.is-active{color:var(--accent-press);background:#fff;border-bottom-color:var(--accent)}
    .copy{appearance:none;border:1px solid var(--border);background:#fff;font:inherit;font-size:12px;
      font-weight:600;color:var(--text);padding:5px 10px;border-radius:7px;cursor:pointer;margin-bottom:6px}
    .copy:hover{border-color:#cfd4dc}
    .copy.ok{color:var(--green);border-color:#bfe3d2;background:var(--green-soft)}
    .code{display:none;margin:0;padding:14px 16px;background:var(--code-bg);color:var(--code-text);
      font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow-x:auto}
    .code.is-active{display:block}
    .code code{font-family:inherit;white-space:pre}

    .empty{text-align:center;color:var(--muted);padding:28px 0}
    .stack-16{display:flex;flex-direction:column;gap:0}
    .muted{color:var(--muted)}
    .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}

    @media (max-width:560px){
      .app{padding:16px 14px 48px}
      .type-actions{width:100%}
      .code{font-size:12px}
    }
  </style>
</head>
<body>
  {% block layout %}{% endblock %}
  <script>
    document.addEventListener('click', function (e) {
      var tab = e.target.closest('.tab');
      if (tab) {
        var ex = tab.closest('.examples');
        ex.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('is-active'); });
        ex.querySelectorAll('.code').forEach(function (c) { c.classList.remove('is-active'); });
        tab.classList.add('is-active');
        var pre = ex.querySelector('#' + tab.dataset.target);
        if (pre) pre.classList.add('is-active');
        return;
      }
      var copy = e.target.closest('.copy');
      if (copy) {
        var ex2 = copy.closest('.examples');
        var active = ex2.querySelector('.code.is-active code') || ex2.querySelector('.code.is-active');
        var text = active ? active.innerText : '';
        navigator.clipboard.writeText(text).then(function () {
          var old = copy.textContent;
          copy.textContent = 'コピーしました';
          copy.classList.add('ok');
          setTimeout(function () { copy.textContent = old; copy.classList.remove('ok'); }, 1200);
        });
      }
    });
  </script>
</body>
</html>
